<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Мини-магазин Telegram WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0; padding: 1rem;
        }
        h1 {
            text-align: center;
        }
        .product {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
        }
        #cart {
            margin-top: 2rem;
            border-top: 2px solid #888;
            padding-top: 1rem;
        }
        #cart-items {
            margin-bottom: 1rem;
        }
        #pay-button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1.2rem;
            border-radius: 6px;
            cursor: pointer;
        }
        #pay-button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Мини-магазин</h1>

    <div class="product" data-id="product1" data-price="5000">
        <div>Товар 1 — 50.00 ₽</div>
        <button class="add-btn">Добавить в корзину</button>
    </div>
    <div class="product" data-id="product2" data-price="3000">
        <div>Товар 2 — 30.00 ₽</div>
        <button class="add-btn">Добавить в корзину</button>
    </div>

    <div id="cart">
        <h2>Корзина</h2>
        <div id="cart-items">Корзина пуста</div>
        <div><strong>Итого: </strong><span id="total">0.00 ₽</span></div>
        <button id="pay-button" disabled>Оплатить</button>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const products = {
        product1: {name: "Товар 1", price: 5000},
        product2: {name: "Товар 2", price: 3000},
    };

    const cart = {};

    function updateCartUI() {
        const cartItemsDiv = document.getElementById("cart-items");
        const totalSpan = document.getElementById("total");
        let total = 0;
        let html = "";

        for (const [id, qty] of Object.entries(cart)) {
            if (qty > 0) {
                const product = products[id];
                const sum = product.price * qty;
                total += sum;
                html += `<div>${product.name} × ${qty} — ${(sum / 100).toFixed(2)} ₽</div>`;
            }
        }

        if (!html) {
            cartItemsDiv.innerHTML = "Корзина пуста";
            totalSpan.textContent = "0.00 ₽";
            document.getElementById("pay-button").disabled = true;
        } else {
            cartItemsDiv.innerHTML = html;
            totalSpan.textContent = (total / 100).toFixed(2) + " ₽";
            document.getElementById("pay-button").disabled = false;
        }
    }

    document.querySelectorAll(".add-btn").forEach(button => {
        button.addEventListener("click", () => {
            const productDiv = button.closest(".product");
            const id = productDiv.dataset.id;
            cart[id] = (cart[id] || 0) + 1;
            updateCartUI();
        });
    });

    document.getElementById("pay-button").addEventListener("click", () => {
        // Отправляем данные корзины боту через sendData (JSON)
        const cartForSend = {};
        let total = 0;
        for (const [id, qty] of Object.entries(cart)) {
            if (qty > 0) {
                cartForSend[id] = qty;
                total += products[id].price * qty;
            }
        }
        const data = {
            cart: cartForSend,
            total: total,
        };
        tg.sendData(JSON.stringify(data));
    });

    updateCartUI();
</script>
</body>
</html>
