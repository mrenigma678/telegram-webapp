<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Telegram Web App Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Ваш CSS без изменений */
  * {
    box-sizing: border-box;
  }
  body, html {
    margin: 0; padding: 0; height: 100%;
    font-family: Arial, sans-serif;
    background: url('your-background-image.jpeg') no-repeat center center fixed;
    background-size: cover;
    color: #222;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #app {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
    background-color: transparent;
    position: relative;
  }
  nav {
    width: 228.8px;
    background-color: rgba(211, 211, 211, 0.4);
    border-right: none;
    padding: 15px 10px;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  nav .logo-container {
    width: 100%;
    height: 80px;
    margin-bottom: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  nav .logo-container img {
    max-height: 70px;
    max-width: 100%;
    object-fit: contain;
  }
  nav button.category-btn {
    background: none;
    border: none;
    padding: 10px 15px;
    margin: 5px 0;
    text-align: left;
    font-size: 13.44px;
    cursor: pointer;
    border-radius: 6px;
    transition: background-color 0.3s, color 0.3s;
    font-weight: 700;
    font-style: normal;
    color: black;
  }
  nav button.category-btn.active,
  nav button.category-btn:hover {
    background-color: #2f2f2f;
    color: white;
  }
  main {
    flex: 1;
    padding: 20px 20px 100px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: transparent;
    position: relative;
  }
  #products {
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
    gap: 20px;
    justify-items: center;
  }
  .product-card {
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    width: 156px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 15px 10px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.2s;
  }
  .product-card:hover {
    transform: scale(1.03);
  }
  .product-card img {
    width: 100%;
    height: 96px;
    object-fit: contain;
    border-radius: 8px;
    margin-bottom: 10px;
    background: #f9f9f9;
  }
  .product-name {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    text-align: center;
    word-wrap: break-word;
  }
  .product-price {
    color: #2f2f2f;
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 14px;
  }
  #product-description {
    max-width: 900px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    padding: 20px;
    margin-top: 20px;
  }
  #product-description h3 {
    margin-top: 0;
  }
  #product-description p {
    margin-bottom: 15px;
    line-height: 1.4;
  }
  #product-description .buttons-container {
    display: flex;
    gap: 10px;
  }
  #product-description button {
    background: #2f2f2f;
    border: none;
    color: white;
    padding: 5px 8px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 10px;
    min-width: 100px;
    flex-shrink: 0;
    transition: background-color 0.3s;
  }
  #product-description button#close-desc-btn {
    background: #555555;
    color: white;
    min-width: 80px;
    flex-shrink: 0;
  }
  #product-description button:hover {
    background-color: #1f1f1f;
  }
  #notification {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: #2f2f2f;
    color: white;
    padding: 8px 15px;
    border-radius: 6px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 200;
  }
  #cart {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    background: #2f2f2f;
    color: white;
    font-weight: 700;
    padding: 10px 25px;
    border-radius: 15px 15px 0 0;
    cursor: pointer;
    user-select: none;
    z-index: 1000;
    height: 50px;
    line-height: 30px;
    white-space: nowrap;
    font-size: 16px;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
  }
  #cart:hover {
    background-color: #1f1f1f;
  }
  #pay-btn {
    background: #2f2f2f;
    border: none;
    color: white;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background-color 0.3s;
  }
  #pay-btn:hover {
    background-color: #1f1f1f;
  }
  #cart-modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1100;
  }
  #cart-modal .modal-content {
    background: white;
    border-radius: 10px;
    max-width: 400px;
    width: 90%;
    padding: 20px;
    max-height: 80vh;
    overflow-y: auto;
  }
  #cart-modal h3 {
    margin-top: 0;
  }
  #cart-modal ul {
    list-style: none;
    padding-left: 0;
    margin-bottom: 15px;
  }
  #cart-modal ul li {
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #cart-modal ul li button.remove-btn {
    background: #555555;
    border: none;
    color: white;
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  #cart-modal button.close-btn {
    background: #2f2f2f;
    border: none;
    color: white;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
  }
  @media (max-width: 768px) {
    nav {
      width: 148.64px;
      padding: 10px 5px;
      background-color: rgba(211, 211, 211, 0.4);
    }
    nav .logo-container {
      height: 60px;
      margin-bottom: 10px;
    }
    nav .logo-container img {
      max-height: 50px;
    }
    nav button.category-btn {
      font-size: 10.75px;
      padding: 8px 10px;
      font-weight: 700;
      font-style: normal;
      color: black;
    }
    nav button.category-btn.active,
    nav button.category-btn:hover {
      background-color: #2f2f2f;
      color: white;
    }
    #cart {
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 20px;
      height: 45px;
      line-height: 25px;
      font-size: 14px;
      border-radius: 12px 12px 0 0;
    }
    #pay-btn {
      padding: 5px 12px;
      font-size: 12px;
    }
    #products {
      max-width: 100%;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 15px;
    }
    .product-card {
      width: 110px;
      padding: 10px 7px;
    }
    .product-card img {
      height: 66px;
    }
    .product-name {
      font-size: 11px;
    }
    .product-price {
      font-size: 11px;
      color: #2f2f2f;
    }
    #product-description {
      max-width: 100%;
      padding: 15px;
      font-size: 14px;
      background: white;
    }
    #product-description .buttons-container {
      flex-direction: column;
      gap: 8px;
    }
    #product-description button {
      padding: 4px 7px;
      font-size: 9px;
      min-width: 100%;
      background: #2f2f2f;
      color: white;
    }
    #product-description button#close-desc-btn {
      min-width: 100%;
      background: #555555;
      color: white;
    }
    #cart-modal ul li button.remove-btn {
      background: #555555;
    }
    #cart-modal button.close-btn {
      background: #2f2f2f;
    }
  }
</style>
</head>
<body>

  <h1>Каталог товаров</h1>
  <div class="products">
    <div class="product" data-name="Товар 1" data-price="100.5">
      <h3>Товар 1</h3>
      <p>Описание товара 1</p>
      <span>Цена: 100.5 ₽</span><br />
      <button class="add-to-cart">Добавить в корзину</button>
    </div>
    <div class="product" data-name="Товар 2" data-price="50">
      <h3>Товар 2</h3>
      <p>Описание товара 2</p>
      <span>Цена: 50 ₽</span><br />
      <button class="add-to-cart">Добавить в корзину</button>
    </div>
  </div>

  <h2>Корзина</h2>
  <table class="cart">
    <thead>
      <tr>
        <th>Товар</th>
        <th>Количество</th>
        <th>Цена за шт.</th>
        <th>Итого</th>
        <th>Удалить</th>
      </tr>
    </thead>
    <tbody id="cart-body">
      <!-- Товары будут добавляться сюда -->
    </tbody>
  </table>
  <div>
    <strong>Общая стоимость: <span id="total-price">0 ₽</span></strong>
  </div>
  <button id="pay-btn" disabled>Оплатить</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let cartItems = [];

    function updateCart() {
      const tbody = document.getElementById('cart-body');
      tbody.innerHTML = '';

      let total = 0;
      cartItems.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;

        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.name}</td>
          <td><input type="number" min="1" value="${item.quantity}" data-index="${index}" class="item-quantity"></td>
          <td>${item.price} ₽</td>
          <td>${itemTotal.toFixed(2)} ₽</td>
          <td><button class="remove-item" data-index="${index}">Удалить</button></td>
        `;
        tbody.appendChild(row);
      });

      document.getElementById('total-price').textContent = total.toFixed(2) + ' ₽';
      document.getElementById('pay-btn').disabled = cartItems.length === 0;
    }

    function addToCart(name, price) {
      const existing = cartItems.find(item => item.name === name);
      if (existing) {
        existing.quantity++;
      } else {
        cartItems.push({ name, price, quantity: 1 });
      }
      updateCart();
    }

    document.querySelectorAll('.add-to-cart').forEach(button => {
      button.addEventListener('click', () => {
        const product = button.closest('.product');
        const name = product.dataset.name;
        const price = parseFloat(product.dataset.price);
        addToCart(name, price);
      });
    });

    document.getElementById('cart-body').addEventListener('input', event => {
      if (event.target.classList.contains('item-quantity')) {
        const index = event.target.dataset.index;
        let val = parseInt(event.target.value);
        if (val < 1 || isNaN(val)) val = 1;
        cartItems[index].quantity = val;
        updateCart();
      }
    });

    document.getElementById('cart-body').addEventListener('click', event => {
      if (event.target.classList.contains('remove-item')) {
        const index = event.target.dataset.index;
        cartItems.splice(index, 1);
        updateCart();
      }
    });

    document.getElementById('pay-btn').addEventListener('click', async () => {
      if (cartItems.length === 0) return;

      try {
        const response = await fetch('https://твой_сервер/create_invoice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: cartItems })
        });
        const data = await response.json();

        if (data.invoiceUrl) {
          tg.openInvoice(data.invoiceUrl);
        } else {
          alert('Ошибка при создании платежа');
        }
      } catch (err) {
        console.error('Ошибка:', err);
        alert('Ошибка сети или сервера');
      }
    });

    updateCart();
  </script>
</body>
</html>
